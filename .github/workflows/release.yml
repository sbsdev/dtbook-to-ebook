on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+' # release tags, i.e. v0.1.0

name: Upload Release Asset

permissions:
  contents: write

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # the DAISY Pipeline build plugins only work on Java 8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build project and run tests
        run: mvn --batch-mode package
      - name: Create release and upload release asset
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: ./target/dtbook-to-ebook_*_all.deb
